[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepcore-search-assignment"
version = "1.0.0"
description = "DeepCore AI search assignment"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["pygame-ce>=2.5.6"]

[project.scripts]
deepcore = "deepcore.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
